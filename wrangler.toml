# =====================================================================
# Wrangler config — Cloudflare WORKERS (Static Assets) + local dev bindings
#
# CATATAN ENV VARIABLES (klasifikasi):
#   - BUILD-TIME (inline via import.meta.env, disuntikkan di
#     .github/workflows/deploy.yml): PUBLIC_SUPABASE_URL,
#     PUBLIC_SUPABASE_ANON_KEY, PUBLIC_TURNSTILE_SITE_KEY.
#   - RUNTIME SECRET (`npx wrangler secret put X` — deploy.yml
#     otomatis men-set dari GitHub secrets, dibaca via env.X):
#       TURNSTILE_SECRET_KEY            (Turnstile server-side verify)
#       SUPABASE_URL                    (salinan PUBLIC_SUPABASE_URL)
#       SUPABASE_SERVICE_ROLE_KEY       (endpoint /api/backup-config)
#       BACKUP_FETCH_TOKEN              (gate endpoint backup-config)
#       GDRIVE_CONFIG_ENCRYPTION_SECRET (enkripsi-at-rest SA key Drive)
#   - [vars] (runtime, non-rahasia): belum ada — tambahkan di sini bila
#     nanti ada variabel non-rahasia yang dibaca via env.* di kode.
#   Untuk dev lokal: file .dev.vars (gitignored) menyediakan nilai
#   runtime secret di atas untuk `astro dev` / `wrangler dev`.
#
# CATATAN VERSI: @astrojs/cloudflare v13+ TIDAK lagi mendukung Cloudflare
# Pages. Deploy target resmi adalah Cloudflare Workers (Static Assets):
#   npx astro build
#   npx wrangler deploy dist/server/wrangler.json
# (config lengkap worker + assets di-generate adapter ke dist/server/)
#
# File ini dipakai saat `astro dev` (vite plugin membaca binding dari sini,
# miniflare menyediakan KV lokal) dan sebagai sumber binding saat deploy
# CLI. Bila deploy lewat dashboard, binding diset di:
#   Workers & Pages > <nama worker> > Settings > Bindings > KV namespace.
# =====================================================================

name = "website-portofolio"
compatibility_date = "2026-08-01"

# qrcode/pngjs (QR TOTP MFA enrollment) memakai modul Node.js
# (fs, stream, zlib, util, buffer, assert) di runtime server.
compatibility_flags = ["nodejs_compat"]

# ===== KV namespace untuk rate limiting =====
# Id ASLI (sudah dibuat via `npx wrangler kv namespace create RATE_LIMIT_KV`).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b6712a968e694199a6dd5efce80d97f8"

# ===== Observability (Workers Logs) =====
# Mengaktifkan log invocation + console.log untuk debugging Turnstile
# (`[TURNSTILE DEBUG]`). head_sampling_rate = 1 -> 100% request di-sample.
# NOTE: toggle "Invocation Logs" di dashboard
#   Workers & Pages > website-portofolio > Settings > Logs
# juga harus ON agar invocation tsb muncul di Observability > Logs.
[observability]
enabled = true
head_sampling_rate = 1
