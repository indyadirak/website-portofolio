# Konfigurasi lychee untuk pemeriksaan tautan berkala situs produksi.
# Dijalankan oleh .github/workflows/link-check.yml (mingguan + manual).
# Bukan gate deploy: hasilnya hanya menandai run merah bila ada tautan mati.

# Batasi konkurensi agar tidak membebani domain eksternal (rate limit).
max_concurrency = 4
# Retry ringan untuk kegagalan jaringan sesaat (bukan tautan mati permanen).
max_retries = 2
retry_wait_time = 2
# Batas waktu per request (detik).
timeout = 30
# UA browser: sebagian situs eksternal menolak UA non-browser (403).
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

# Status yang dianggap sehat. Redirect (3xx) diikuti lychee secara default,
# jadi yang diperiksa adalah status respons final.
accept = [200, 204, 206]

# Jangan periksa anchor-only (#...), email, dan host lokal.
# lychee 0.24 mengubah tipe ini dari boolean menjadi enum string.
include_fragments = "none"
exclude = [
  "^mailto:",
  "^#",
  "localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://\\[::1\\]",
  # LinkedIn membalas 403 ke crawler (bot-walled). Tautannya tetap
  # diverifikasi manual saat menambah/mengubah profil.
  "^https?://([a-z0-9-]+\\.)?linkedin\\.com/",
]
