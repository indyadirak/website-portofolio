name: Database Backup

on:
  schedule:
    # Minggu 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client & GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client gpg

      # Hanya skema public (tabel aplikasi: projects, skills, contact_messages,
      # certificates, profiles, login_attempts). Skema auth MILIK SUPABASE
      # (users, hashed passwords) TIDAK ikut di-dump — sudah otomatis dikelola
      # dan di-backup oleh infrastruktur Supabase sendiri.
      #
      # PENTING — secret SUPABASE_DB_URL harus berisi connection string
      # SESSION POOLER (port 5432), BUKAN Transaction Pooler (port 6543).
      # pg_dump memakai protokol COPY yang TIDAK kompatibel dengan Transaction
      # Pooler (mode transaction), yang bisa membuat backup hang/gagal —
      # terutama saat ukuran data bertambah. Ambil dari dashboard Supabase:
      #   Project Settings > Database > Connection string > SESSION POOLER
      # contoh: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # (jangan lupa tambahkan ?sslmode=require di akhir URL).
      - name: Dump public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner --no-privileges \
            -f backup.sql

      # Enkripsi SIMETRIS (AES-256): file .sql mentah tidak pernah
      # disimpan sebagai artifact. Passphrase di GitHub Secret terpisah.
      - name: Encrypt dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_KEY" \
            -o backup.sql.gpg backup.sql
          rm -f backup.sql

      # ===== Salinan KEDUA: Google Drive (prinsip 3-2-1) =====
      # File .gpg yang sama di-upload ke folder Drive via Service Account.
      # NON-BLOCKING: kegagalan upload Drive (kuota penuh, token error, dll)
      # TIDAK menggagalkan job — artifact GitHub tetap salinan utama untuk
      # restore cepat; di sini cukup warning di log (continue-on-error).
      #
      # Secrets yang dibutuhkan:
      #   GDRIVE_SERVICE_ACCOUNT_KEY = isi JSON key Service Account (download
      #     dari GCloud Console) di-encode base64 SATU BARIS.
      #   GDRIVE_BACKUP_FOLDER_ID    = ID folder khusus di Drive (bagian URL
      #     setelah /folders/), di-share "Editor" ke email Service Account.
      # Step ini otomatis di-skip selama kedua secret belum diset.
      - name: Upload encrypted backup to Google Drive (optional)
        if: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY != '' && secrets.GDRIVE_BACKUP_FOLDER_ID != '' }}
        continue-on-error: true
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_BACKUP_FOLDER_ID: ${{ secrets.GDRIVE_BACKUP_FOLDER_ID }}
          DRIVE_RETENTION_WEEKS: "12"
          BACKUP_FILE: backup.sql.gpg
        run: |
          # googleapis di-install ke temp dir agar tidak mencemari repo;
          # script di-copy ke dir yang sama supaya resolve modul ESM sukses.
          mkdir -p "$RUNNER_TEMP/gdrive"
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/gdrive" googleapis
          cp .github/scripts/gdrive-backup.mjs "$RUNNER_TEMP/gdrive/"
          node "$RUNNER_TEMP/gdrive/gdrive-backup.mjs"

      # Retention 30 hari (bukan default 90) — membatasi backup lama tersimpan.
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gpg
          retention-days: 30
