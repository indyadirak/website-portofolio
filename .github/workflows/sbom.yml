# SBOM (Software Bill of Materials) — export dependency graph ke GitHub
# Dependency Graph. Dari sana GitHub menampilkan SBOM (Security > Dependency
# graph) dan bisa diekspor (Actions > SBOM export). Menutup gap kepatuhan
# A.5.21 / rantai pasokan: daftar dependency + lisensinya selalu terkini.
name: "SBOM Export"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # diperlukan action untuk menulis ke Dependency Submission API

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM for npm dependencies
        uses: advanced-security/sbom-generator-action@v0.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}