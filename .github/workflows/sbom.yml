# SBOM (Software Bill of Materials) — generate dari lockfile via Syft
# (anchore/sbom-action, menggantikan sbom-generator-action yang sudah
# deprecated) lalu unggah ke GitHub Dependency Graph (Security > Dependency
# graph > SBOM). Menutup gap kepatuhan A.5.21 / rantai pasokan: daftar
# dependency + lisensinya selalu terkini.

name: "SBOM Export"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # diperlukan untuk unggah ke Dependency Submission API

jobs:
  sbom:
    runs-on: ubuntu-latest
    # Least privilege di level job: contents: write WAJIB untuk Dependency
    # Submission API (publish-sbom); tidak ada permission lain yang dibuka.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./
          format: cyclonedx-json
          artifact-name: sbom-results

      - name: Upload SBOM ke GitHub Dependency Graph
        uses: anchore/sbom-action/publish-sbom@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact: sbom-results