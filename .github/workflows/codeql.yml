# CodeQL Code Scanning
# DINONAKTIFKAN otomatis (2026-09-27): repo ini PRIVATE tanpa GitHub
# Advanced Security, sehingga step upload SARIF selalu gagal dengan
# "Code scanning is not enabled for this repository" — analisisnya sendiri
# jalan normal, tapi hasilnya tidak bisa diterima GitHub.
# Workflow ini hanya manual (workflow_dispatch) untuk dipakai nanti bila
# repo menjadi public / GHAS tersedia. Jaring pengaman dependency tetap
# jalan: npm audit (deploy.yml), dependency-review.yml, sbom.yml.
# Hasil: GitHub > Security > Code scanning alerts (bila sudah enable)
name: "CodeQL"

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload hasil scan ke Code scanning alerts
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Inisialisasi CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # Autobuild: untuk JavaScript/TypeScript hanya mengekstrak kode,
      # tidak diperlukan proses build aplikasi.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
