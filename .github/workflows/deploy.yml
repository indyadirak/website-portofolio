name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workflow ini INDEPENDEN dari codeql.yml & dependency-review.yml —
# GitHub Actions menjalankan ketiganya paralel, tidak ada penggabungan.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Least privilege di level job (selaras workflow-level di atas):
    # workflow ini hanya membaca repo + deploy via CLOUDFLARE_API_TOKEN secret.
    permissions:
      contents: read
    # Secrets TIDAK bisa direferensikan langsung di `if:` — pola resmi:
    # petakan ke job-level env dulu, lalu `if: env.X != ''` (job env
    # tersedia di konteks `if`; step-level env TIDAK).
    env:
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_FETCH_TOKEN: ${{ secrets.BACKUP_FETCH_TOKEN }}
      GDRIVE_CONFIG_ENCRYPTION_SECRET: ${{ secrets.GDRIVE_CONFIG_ENCRYPTION_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # GUARD: RATE_LIMIT_KV id wajib ASLI sebelum deploy.
      # Dengan id placeholder (00000000-...), kv.get() selalu null —
      # rate limiter tampak jalan tapi TIDAK PERNAH membatasi (silent
      # inert, tanpa tanda kegagalan). Blok deploy sampai id diganti:
      #   npx wrangler kv namespace create RATE_LIMIT_KV
      # lalu update id di wrangler.toml.
      - name: Guard KV namespace id (anti silent-inert)
        run: |
          if grep -q "00000000-0000-0000-0000-000000000000" wrangler.toml; then
            echo "::error::RATE_LIMIT_KV masih pakai id PLACEHOLDER di wrangler.toml. Jalankan 'npx wrangler kv namespace create RATE_LIMIT_KV', ganti id-nya, lalu deploy ulang. Rate limiting login & backup-config TIDAK AKTIF dengan id dummy."
            exit 1
          fi
          echo "KV namespace id OK"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Audit kerentanan dependensi — gagalkan deploy bila ada kerentanan
      # high/critical pada lockfile (lapis di atas dependency-review yang
      # hanya berjalan di PR; ini menutup push langsung & workflow_dispatch).
      - name: npm audit (high/critical gate)
        run: npm audit --audit-level=high

      # ===== Build-time env =====
      # PUBLIC_* dibaca via import.meta.env dan di-INLINE saat build
      # (src/lib/supabase.ts, src/lib/config.ts). TURNSTILE_SECRET_KEY
      # SENGAAA tidak di sini — itu rahasia asli, disuntikkan ke RUNTIME
      # (step "Set Turnstile secret" di bawah) supaya tidak pernah
      # ter-bake ke bundle. Workflow tetap berhasil jika kosong
      # (fallback demo data / Turnstile nonaktif).
      - name: Build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      # Config lengkap (main, assets, KV binding, compatibility flags)
      # di-generate adapter ke dist/server/wrangler.json saat build, dan
      # adapter juga menulis .wrangler/deploy/config.json (config-redirect,
      # fitur wrangler >=3.101: berguna untuk build tools). Karena itu
      # deploy dipanggil TANPA argumen config — wrangler mengikuti redirect
      # menuju dist/server/wrangler.json. Meneruskan path config di CLI
      # sekaligus membuat wrangler 4.1xx error "user configuration file
      # dan deploy configuration file tidak share base path".
      # NOTE: dipakai npx wrangler langsung (bukan wrangler-action@v3 —
      # action tersebut internal wrangler 3.x untuk Node 20 & sering gagal
      # dengan config static-assets wrangler 4.x). wrangler terinstall dari
      # devDependencies (package.json), versi deterministik.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Turnstile secret -> runtime secret Worker (bukan build artifact).
      # Rotasi cukup dengan mengganti nilai secret & run ulang workflow
      # ini — tanpa rebuild/redeploy kode. Sekali ter-set, nilainya
      # tersimpan di Cloudflare (tidak muncul di log Actions).
      - name: Set Turnstile secret (runtime)
        if: env.TURNSTILE_SECRET_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: echo "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY

      # ===== Secrets runtime untuk Google Drive backup offload (3-2-1) =====
      # SUPABASE_URL hanya salinan dari PUBLIC_SUPABASE_URL (URL bukan rahasia,
      # tapi dipindah jadi runtime secret supaya tidak perlu masuk repo).
      - name: Set SUPABASE_URL secret (runtime)
        if: env.PUBLIC_SUPABASE_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
        run: echo "$PUBLIC_SUPABASE_URL" | npx wrangler secret put SUPABASE_URL

      # ===== Verifikasi pasca-deploy: security headers di produksi =====
      # Regresi CSP/header hanya terdeteksi dengan benar di response
      # produksi — cek di sini, gagalkan run bila salah satu header wajib
      # hilang. Retry untuk penyebaran edge.
      #
      # Diperiksa DUA jalur pengiriman (dibuktikan saat audit Section A:
      # wrangler dev workerd — /certificates dilayani sebagai static asset,
      # header berasal dari _headers, middleware TIDAK jalan):
      #   /             -> SSR (middleware men-set header programatik)
      #   /certificates -> prerender (statis; header dari _headers)
      #
      # CATATAN (fix 2026-08-19): verifikasi sebelumnya gagal karena
      # (1) `curl -sSI` + grep "^HTTP/2 200" — di runner curl merundingkan
      # HTTP/1.1 sehingga grep tidak pernah match, dan (2) /certificates
      # kini 307 -> /certificates/ (trailing slash). Gunakan `-L` untuk
      # mengikuti redirect dan `-D -` untuk menangkap header respons final,
      # lalu periksa status dengan pola toleran versi HTTP.
      - name: Verify security headers (production)
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://portofolio.indyadirak.my.id' }}
        run: |
          for path in "/" "/certificates"; do
            ok=0
            for i in 1 2 3 4 5; do
              H="$(curl -sSL -o /dev/null -D - -A "header-check" "${PROD_URL}${path}")"
              if [ -n "$H" ] && printf '%s' "$H" | grep -qiE "^HTTP/[12] 200"; then ok=1; break; fi
              [ "$i" -lt 5 ] && sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::fetch gagal untuk ${path}"; exit 1
            fi
            echo "=== ${path} (HTTP OK) ==="
            for h in "content-security-policy" "strict-transport-security" "x-content-type-options: nosniff" "x-frame-options: deny"; do
              if printf '%s' "$H" | grep -qi "$h"; then
                echo "OK: $h"
              else
                echo "::error::Header hilang pada ${path}: $h"; exit 1
              fi
            done
            # HSTS khusus: kalau Cloudflare edge overwrite jadi max-age=0
            # (dashboard zone HSTS off), ingatkan — browser tidak akan
            # meng-cache HSTS sama sekali.
            if printf '%s' "$H" | grep -qi "strict-transport-security: max-age=0"; then
              echo "::warning::HSTS dikembalikan max-age=0 (Cloudflare edge override). Aktifkan HSTS di Cloudflare dashboard: SSL/TLS > Edge Certificates > HSTS (enable + include subdomains + preload)."
            fi
          done

      # ===== Secrets runtime untuk Google Drive backup offload (3-2-1) =====

      # service_role key — dipakai endpoint /api/backup-config (server-side)
      # untuk membaca konfigurasi Drive saat workflow backup menjalankan
      # db-backup.yml. Dari dashboard Supabase: Project Settings > API >
      # service_role (JANGAN dicampur dengan anon key).
      - name: Set SUPABASE_SERVICE_ROLE_KEY secret (runtime)
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      # Token pemanggilan /api/backup-config dari GitHub Actions. Nilai
      # HARUS sama dengan secrets.BACKUP_FETCH_TOKEN di repo (satu sumber
      # kebenaran: set sekali di GitHub, disalin otomatis ke Worker di sini).
      - name: Set BACKUP_FETCH_TOKEN secret (runtime)
        if: env.BACKUP_FETCH_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_FETCH_TOKEN: ${{ secrets.BACKUP_FETCH_TOKEN }}
        run: echo "$BACKUP_FETCH_TOKEN" | npx wrangler secret put BACKUP_FETCH_TOKEN

      # Kunci AES-256-GCM untuk enkripsi-at-rest JSON key Service Account
      # Drive di tabel backup_config (GUI admin). Harus acak & >= 32 byte.
      - name: Set GDRIVE_CONFIG_ENCRYPTION_SECRET secret (runtime)
        if: env.GDRIVE_CONFIG_ENCRYPTION_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GDRIVE_CONFIG_ENCRYPTION_SECRET: ${{ secrets.GDRIVE_CONFIG_ENCRYPTION_SECRET }}
        run: echo "$GDRIVE_CONFIG_ENCRYPTION_SECRET" | npx wrangler secret put GDRIVE_CONFIG_ENCRYPTION_SECRET
