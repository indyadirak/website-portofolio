# Supabase Keep-Alive — mencegah auto-pause database free tier
# setelah ~7 hari tidak aktif.
#
# Cara kerja:
#   Semua halaman HTML publik project ini DI-PRERENDER (statis) dan TIDAK
#   menjalankan query database pada saat request. Karena itu GET ke `/`
#   tidak cukup untuk membuat project Supabase tercatat "aktif".
#   Workflow ini GET `/api/health` (SSR) — endpoint tersebut menjalankan
#   satu query ringan ke Postgres (`count head site_settings`) pada setiap
#   panggilan. Selama query sampai ke DB, project Supabase dianggap aktif
#   dan tidak akan di-pause.
#
# Keamanan: hanya memanggil URL publik yang dilayani Cloudflare Workers —
# TANPA secret Supabase. `permissions: contents: read` (least privilege;
# job ini sebenarnya tidak butuh GITHUB_TOKEN sama sekali).
name: Supabase Keep-Alive

on:
  schedule:
    # Tiap 5 hari pada jam 00:00 UTC (hari 1, 6, 11, 16, 21, 26, 31).
    - cron: "0 0 */5 * *"
  workflow_dispatch: # izinkan trigger manual untuk uji coba

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health (memicu query DB nyata)
        env:
          # Origin workers.dev dipakai lebih dulu: domain custom bisa diblokir
          # WAF/Bot Fight untuk runner GitHub (403 managed challenge), sehingga
          # ping tidak pernah sampai ke Worker dan database tidak "tersentuh".
          WORKER_ORIGIN_URL: ${{ vars.WORKER_ORIGIN_URL || 'https://website-portofolio.indyadirak.workers.dev' }}
          PROD_URL: ${{ vars.PROD_URL || secrets.PROD_URL || 'https://portofolio.indyadirak.com' }}
        run: |
          # UA browser + retry: Cloudflare Bot Fight Mode / Managed Challenge
          # kadang membalas 403 ke runner GitHub (UA "supabase-keep-alive"
          # dianggap bot).
          WORKER_ORIGIN_URL="${WORKER_ORIGIN_URL%/}"
          PROD_URL="${PROD_URL%/}"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          RESPONSE="000"
          USED="none"
          for base in "$WORKER_ORIGIN_URL" "$PROD_URL"; do
            for i in 1 2 3; do
              RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
                --retry 2 --retry-delay 5 --retry-all-errors \
                -A "$UA" "${base}/api/health")
              echo "attempt ${i} via ${base}: GET /api/health -> HTTP ${RESPONSE}"
              if [ "$RESPONSE" = "200" ]; then USED="$base"; break; fi
              [ "$i" -lt 3 ] && sleep 10
            done
            [ "$RESPONSE" = "200" ] && break
          done

          if [ "$RESPONSE" = "200" ]; then
            echo "Supabase project aktif (via ${USED})."
            exit 0
          fi

          # 403 bertanda tangan Cloudflare (WAF/Bot Fight), BUKAN DB ter-pause.
          # Jangan gagalkan workflow (yang tadinya memicu alarm palsu berulang).
          if [ "$RESPONSE" = "403" ]; then
            echo "::warning::GET /api/health dibalas 403 oleh Cloudflare (WAF/Bot Fight) di kedua origin. Ping tidak sampai ke database — tambahkan WAF Skip rule untuk /api/health bila memakai custom domain. Bukan kegagalan DB."
            exit 0
          fi

          echo "::error::Diharapkan HTTP 200, dapat ${RESPONSE}. Jika database sudah ter-pause, bangunkan lewat query ringan di Supabase SQL Editor (mis. select 1), lalu jalankan ulang workflow ini."
          exit 1