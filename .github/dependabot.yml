# Dependabot version updates
# Interval monthly: hanya untuk update versi rutin.
# NOTE: "Dependabot security updates" (patch kerentanan kritis) TIDAK diatur
# lewat file ini — aktifkan manual di GitHub > Settings > Code security and
# analysis > Dependabot alerts + Dependabot security updates. Security updates
# berjalan otomatis di luar jadwal bulanan ini begitu muncul advisories.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Kelompokkan update devDependencies jadi satu PR saja
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Kelompokkan framework agar tidak banjir PR per-package
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      supabase:
        patterns:
          - "@supabase/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
